name: Validate

on:
  pull_request:
    paths:
      - "data/**"
      - ".github/workflows/validate.yml"
      - "scripts/**"
      - "tool/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The validation source of truth is entoli's own code (skill_validate
      # + frontmatter), run through its CLI; CI checks out the repo beside
      # this one so `dart ../entoli/tool/...` resolves.
      - uses: actions/checkout@v7
        with:
          repository: ByteRepair/entoli
          ref: master
          path: entoli

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Collect touched entries
        run: |
          git fetch origin "${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
          git diff --name-status -M \
            "origin/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }}" \
            > /tmp/changed.txt
          cat /tmp/changed.txt

      - name: Prepare entoli package
        run: dart pub get --directory entoli

      - name: Validate entries (entoli CLI — source of truth)
        run: dart run entoli/tool/validate_marketplace.dart --data-root data --changed /tmp/changed.txt

      - name: Validate entries (Python quick check)
        run: python3 scripts/validate.py --changed /tmp/changed.txt