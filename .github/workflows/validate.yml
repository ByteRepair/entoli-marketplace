name: Validate

on:
  pull_request:
    paths:
      - "data/**"
      - ".github/workflows/validate.yml"
      - "scripts/**"
      - "tool/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The validation source of truth is entoli's own code (skill_validate
      # + frontmatter), run through its CLI; CI checks out the repo beside
      # this one so the CLI's imports resolve. Pinned to the branch
      # marketplace support lives on — bump it deliberately when entoli
      # releases change validation.
      - uses: actions/checkout@v7
        with:
          repository: Yiannis128/entoli
          ref: marketplace-validation
          path: entoli

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('entoli/pubspec.lock') }}

      - name: Prepare entoli package
        run: dart pub get --directory entoli

      - name: Collect touched entries
        run: |
          git fetch origin "${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
          git diff --name-status -M \
            "origin/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }}" \
            > /tmp/changed.txt
          cat /tmp/changed.txt

      - name: Validate entries (entoli CLI — source of truth)
        run: dart run entoli/tool/validate_marketplace.dart --data-root data --changed /tmp/changed.txt

      # The two tiers must agree: both validators over the fixture set.
      - name: Fixture check (Dart and Python agree)
        run: ENTOLI_CHECKOUT=entoli dart tool/frontmatter_diff_test.dart