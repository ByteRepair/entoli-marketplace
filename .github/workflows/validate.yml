name: Validate

on:
  pull_request:
    paths:
      - "data/**"
      - ".github/workflows/validate.yml"
      - "scripts/validate.py"

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Collect touched entries
        run: |
          git diff --name-status -M \
            "origin/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }}" \
            > /tmp/changed.txt
          cat /tmp/changed.txt

      - name: Validate entries
        run: python scripts/validate.py --changed /tmp/changed.txt