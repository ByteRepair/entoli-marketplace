name: Deploy

on:
  push:
    branches: [master]
    paths:
      - "data/**"
      - "ext/**"
      - ".github/workflows/deploy.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build
        # ext/ entries fetch their remote content at build time;
        # GITHUB_TOKEN raises the API rate limit for those fetches.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_site.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5